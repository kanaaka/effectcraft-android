[package]
name = "effectcraft-android"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "EffectCraft on Android: the real engine and egui shell on winit's NativeActivity backend"
publish = false

# cargo-apk turns this cdylib into `lib/arm64-v8a/libeffectcraft.so`, and that artifact name is what
# the injected `android.app.lib_name` meta-data points at (with `-` → `_`). A mismatch yields an APK
# that installs and then dies on launch, so the lib name is deliberate — the same shape
# `apps/deckcraft-android`, `apps/vectorcraft-android` and `apps/wordcraft-android` use.
[lib]
name = "effectcraft"
crate-type = ["cdylib"]

# Omit `[lints] workspace = true`: the workspace forbids unsafe_code, which trips on the
# `#[unsafe(no_mangle)]` entry point this crate needs, and nothing else here wants the lints.
[dependencies]
effectcraft-engine = { workspace = true }
# The wired Session: FilmCraft's codecs, the importer, the expression engine, scripting and the
# `FileExporter` — the same `effectcraft_host::session()` the desktop binary uses.
effectcraft-host = { workspace = true }
effectcraft-ui-egui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

# `android-native-activity` is the whole reason this builds: without a backend feature
# `android-activity` is pulled with no backend at all and eframe fails with `file not found for
# module activity_impl` plus `Either "game-activity" or "native-activity" must be enabled as
# features` — a missing feature, not a code problem.
#
# `accesskit` is deliberately absent, and that took a second fix: `crates/ui-egui` declares its own
# eframe with `accesskit`, and Cargo unions features across the whole graph, so enabling it there
# would have enabled it here — and eframe `compile_error!`s `accesskit` + `android-native-activity`
# because egui's accesskit integration on Android goes through the GameActivity backend while this
# packages NativeActivity. The fix lives where the feature is declared: `crates/ui-egui/Cargo.toml`
# now declares eframe twice, the second time under `cfg(not(target_os = "android"))` with accesskit.
# This line is what the desktop keeps.
#
# The android-* features are inert elsewhere (winit only binds android-activity under
# cfg(target_os = "android")), so the host workspace is unaffected.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
# Needed to name `AndroidApp` for `NativeOptions::android_app`; eframe does not re-export winit.
# Pinned to the exact version eframe/egui-winit build against.
winit = { version = "=0.30.13", default-features = false, features = ["android-native-activity"] }

[package.metadata.android]
package = "ai.storyteller.effectcraft"
apk_name = "effectcraft"
build_targets = ["aarch64-linux-android"]
strip = "strip"
# Theme resources — the two edge-to-edge fixes live in res/values/styles.xml.
resources = "res"

[package.metadata.android.sdk]
# 26 = Android 8.0: the floor for a modern Vulkan driver surface.
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "EffectCraft"
# Variant B (immersive fullscreen) is what fixed the menu bar sitting under the notification bar on
# the sibling ports' tablets; variant A is the alternative — see res/values/styles.xml.
theme = "@style/EffectcraftFullscreen"
icon = "@mipmap/ic_launcher"
# The engine reads media by memory map and renders big frames; keep the .so uncompressed so it can
# be mapped from the APK directly.
extract_native_libs = true

# The Activity must not be *re-created* when the window is resized, the soft keyboard appears, the
# density or the font scale changes, or the app is put into split-screen. Entering or leaving
# multi-window changes `screenLayout` and `smallestScreenSize`, and an Activity that does not declare
# them is destroyed and built again. For a NativeActivity that is fatal: winit's Android backend does
# not even forward the destroy (it logs `TODO: forward onDestroy notification to application` and
# carries on), so the old event loop keeps running against a dead Activity while a second one starts
# — the app hangs, then is killed. The symptom a user reports is "it crashes when I put it side by
# side". cargo-apk's default is only `orientation|keyboardHidden|screenSize`; these are the ones a
# fullscreen, resizable native app handles itself.
[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout|density|uiMode|fontScale|keyboard|navigation|touchscreen"

# Rendering is wgpu (Vulkan on Android), so Vulkan is preferred but not required — the compositor
# falls back to the CPU when the device cannot run its compute shaders.
[[package.metadata.android.uses_feature]]
name = "android.hardware.vulkan.level"
required = false
version = 1

# Storage access for the in-app picker (src/file_picker.rs). Android 10+ forbids reading shared
# storage by path, so the picker probes each root and only offers the ones it can actually read — no
# permission is needed for the app's own folder, and these widen what is reachable.
#
# MANAGE_EXTERNAL_STORAGE ("All files access") cannot be requested at runtime: it is granted by hand
# in Settings ▸ Apps ▸ EffectCraft ▸ Special access. Play restricts it to file-manager-class apps,
# which does not apply to a sideloaded build. Save needs it too, to write outside the app's own
# folder.
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

# Reading media without the heavy permission (Android 13+). EffectCraft imports stills, movies and
# audio, so all three media permissions are declared.
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_VIDEO"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_AUDIO"

# Legacy storage permissions, only meaningful before Android 11.
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29
